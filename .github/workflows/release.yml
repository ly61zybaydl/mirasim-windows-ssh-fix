name: Release package

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  legacy-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download Linux runtime and build sources
        shell: bash
        run: |
          set -euo pipefail
          cd assets/linux-compat
          curl --fail --location --retry 3 \
            --output node-v22.23.1-linux-x64-glibc-217.tar.xz \
            https://unofficial-builds.nodejs.org/download/release/v22.23.1/node-v22.23.1-linux-x64-glibc-217.tar.xz
          curl --fail --location --retry 3 \
            --output node-pty-1.2.0-beta.14.tgz \
            https://registry.npmjs.org/node-pty/-/node-pty-1.2.0-beta.14.tgz
          curl --fail --location --retry 3 \
            --output node-addon-api-7.1.0.tgz \
            https://registry.npmjs.org/node-addon-api/-/node-addon-api-7.1.0.tgz
      - name: Build node-pty for glibc 2.27
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/assets/linux-compat:/inputs" \
            ubuntu:18.04 bash -euo pipefail -c '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl xz-utils
              curl --fail --location --retry 3 \
                --output /tmp/miniconda.sh \
                https://repo.anaconda.com/miniconda/Miniconda3-py311_24.11.1-0-Linux-x86_64.sh
              bash /tmp/miniconda.sh -b -p "$HOME/anaconda3"
              build="$HOME/.mirasim-remote/compat-build-v22.23.1-pty-beta14"
              mkdir -p "$build"
              cp /inputs/node-v22.23.1-linux-x64-glibc-217.tar.xz "$build/"
              cp /inputs/node-pty-1.2.0-beta.14.tgz "$build/"
              cp /inputs/node-addon-api-7.1.0.tgz "$build/"
              sh /inputs/build-node-pty.sh
              cp "$build/pty.node" /inputs/pty-node-v127-glibc217.node
            '
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-linux-assets
          if-no-files-found: error
          path: |
            assets/linux-compat/node-v22.23.1-linux-x64-glibc-217.tar.xz
            assets/linux-compat/pty-node-v127-glibc217.node

  package:
    needs: legacy-assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: legacy-linux-assets
          path: .release-assets
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Build the Windows release ZIP
        shell: powershell
        run: ./scripts/package-release.ps1 -AssetDirectory "$PWD/.release-assets" -RuntimeAssetDirectory "$PWD/.windows-runtime"
      - uses: actions/upload-artifact@v4
        with:
          name: mirasim-windows-ssh-fix
          if-no-files-found: error
          path: dist/*-win-x64.zip

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mirasim-windows-ssh-fix
          path: dist
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*-win-x64.zip --generate-notes
